<title>Lista de Compras</title>
<style>

.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s cubic-bezier(.3,.7,.2,1)}

::placeholder{color:#636366}
button{cursor:pointer;border:0;background:#fff;color:#000;border-radius:99px;padding:10px 18px;min-height:44px;font-weight:600;transition:transform .12s,opacity .12s}
button:active{transform:scale(.96);opacity:.85}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sec{background:var(--s2);color:var(--ink)}
.warn{color:var(--red)}

.inrow2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.composer input,.composer select,#ef input,#ef select{background:var(--s2);border:1px solid transparent;border-radius:14px;padding:12px 14px;min-height:46px;width:100%;font-size:1rem}
.composer input:focus,.composer select:focus,#ef input:focus,#ef select:focus,dialog textarea:focus{border-color:#fff;outline:0}
.add{width:46px;height:46px;min-height:0;padding:0;font-size:1.7rem;line-height:1;flex:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.chips b{width:100%;font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:4px 2px 2px}
.chip{background:var(--s2);color:var(--ink);font-weight:500;padding:7px 14px;min-height:36px;font-size:.88rem}
h2{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 8px}

h2 em{font-style:normal;min-width:32px;height:32px;padding:0 6px;border-radius:11px;background:var(--chip,var(--s2));display:grid;place-items:center;font-size:1rem}
h2 span{background:var(--chip,var(--s2));color:var(--ink);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600}
ul{list-style:none;margin:0;padding:0;background:var(--card,var(--s1));border:1px solid var(--bd,var(--line));border-radius:20px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:2px 6px 2px 14px;min-height:56px;animation:in .25s ease}
li+li{border-top:1px solid var(--ln,var(--line))}
li input[type=checkbox]{-webkit-appearance:none;appearance:none;width:26px;height:26px;border:2px solid rgba(255,255,255,.45);border-radius:50%;flex:none;margin:0;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
li input[type=checkbox]::after{content:"";width:6px;height:12px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s}
li input[type=checkbox]:checked{background:#fff;border-color:#fff;transform:scale(1.06)}
li input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
li label{flex:1;padding:14px 0;cursor:pointer;word-break:break-word;font-weight:500;line-height:1.35}
li.done label{color:rgba(255,255,255,.5);text-decoration:line-through}
.q,.gordo{display:inline-block}
.q{background:rgba(0,0,0,.35);color:#f2f2f7;border-radius:99px;padding:2px 9px;font-size:.76rem;margin-left:8px;font-weight:600;white-space:nowrap}
.p{color:var(--mut);font-size:.8rem;margin-left:8px}
.gordo{background:rgba(255,69,58,.16);color:var(--red);font-style:italic;font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 8px;margin-left:8px}
li.done .q,li.done .gordo{opacity:.55}
li button{background:none;color:rgba(255,255,255,.55);padding:8px 10px;min-height:44px;border-radius:12px;font-weight:400}
li button:hover{color:#fff}
.empty{text-align:center;color:var(--mut);padding:44px 12px;line-height:1.6}
.empty .big{font-size:2.6rem;margin-bottom:6px}
.total{margin:14px 4px 0;text-align:right;color:var(--mut);font-weight:600}
.ch{display:flex;gap:12px;flex-wrap:wrap}
.ch .card{flex:1 1 260px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px}
.ch p{margin:0 0 12px;font-weight:700}
.ch svg{width:100%;max-width:190px;display:block;margin:0 auto 14px}
.ch small{color:var(--mut);display:block;margin-top:10px;font-size:.78rem;line-height:1.4}
.ch p.rank{color:var(--red);font-style:italic;text-align:center;background:rgba(255,69,58,.14);border-radius:99px;padding:6px 12px;margin:0 0 6px}
ul.leg{border:0;background:none;border-radius:0;overflow:visible}
.leg li{min-height:0;padding:4px 0;border:0;font-size:.88rem;gap:8px;animation:none}
.leg li b{margin-left:auto;font-weight:600}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;border-radius:99px;display:none;gap:14px;align-items:center;max-width:92%;z-index:5;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#toast button{background:none;color:#000;padding:0;min-height:0;text-decoration:underline;font-weight:700}
dialog{border:1px solid var(--line);background:var(--s1);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
dialog>p:first-child{font-size:1.2rem;letter-spacing:-.02em;margin-bottom:12px!important}
dialog textarea{display:block;width:100%;height:150px;background:var(--s2);color:var(--ink);border:1px solid transparent;border-radius:14px;padding:12px;font:13px ui-monospace,Menlo,monospace}
#ef{display:grid;gap:12px}
#ef label,#rdlg label{display:grid;gap:6px;font-size:.8rem;font-weight:600;color:var(--mut)}
#rdlg label{margin:12px 0}
#rdlg textarea{height:72px;font:inherit;font-size:1rem}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head>
<body>
<main>
<h1>Lista de Compras</h1>
<p class="sub" id="sub"></p>
<div class="bar"><i id="bar"></i></div>

<form id="f" class="composer" autocomplete="off">
  <div class="inrow">
    <input id="n" list="sug" placeholder="Adicionar produto…" aria-label="Nome do produto" required>
    <button class="add" type="submit" aria-label="Adicionar">+</button>
  </div>
  <div class="inrow2">
    <input id="q" placeholder="Quantidade" aria-label="Quantidade">
    <select id="c" aria-label="Categoria"></select>
  </div>
</form>
<datalist id="sug"></datalist>

<div class="chips" id="chips"></div>

<div class="row" style="margin-top:14px">
  <button id="reset">Repor riscados</button>
  <button class="sec" id="hide">Esconder riscados</button>
  <button class="sec" id="more">Mais…</button>
</div>

<div id="list"></div>
<div class="total" id="total"></div>
<div id="charts"></div>
</main>

<div id="toast"><span id="tmsg"></span><button id="tund">Anular</button></div>

<dialog id="dlg">
  <p id="dtitle" style="margin-top:0;font-weight:600"></p>
  <div class="row">
    <button id="d-copy">Copiar lista para WhatsApp</button>
    <button id="d-clear" class="warn">Remover riscados</button>
    <button id="d-rules">Regras do “Gordos!”</button>
    <button id="d-backup">Cópia de segurança</button>
    <button id="d-merge">Juntar cópia</button>
    <button id="d-restore">Restaurar cópia</button>
  </div>
  <textarea id="ta" hidden aria-label="Cópia de segurança"></textarea>
  <div class="row" style="margin:10px 0 0">
    <button id="d-ok" hidden class="pri">Confirmar</button>
    <button id="d-close">Fechar</button>
  </div>
</dialog>

<dialog id="edlg">
  <p style="margin-top:0;font-weight:600">Editar item</p>
  <div id="ef">
    <label>Nome<input id="en" maxlength="80"></label>
    <label>Quantidade<input id="eq" maxlength="20" placeholder="ex.: 500g, 2, 1l"></label>
    <label>Categoria<select id="ec"></select></label>
    <label>Preço estimado (€)<input id="ep" inputmode="decimal" placeholder="opcional"></label>
    <label>“Gordos!” neste item<select id="eg"><option value="">Automático</option><option value="1">Sempre</option><option value="0">Nunca</option></select></label>
    <div class="row" style="margin:4px 0 0">
      <button class="pri" id="es">Guardar</button>
      <button id="ecancel">Cancelar</button>
    </div>
  </div>
</dialog>

<dialog id="rdlg">
  <p style="margin-top:0;font-weight:600">Regras do “Gordos!”</p>
  <p style="color:var(--mut);font-size:.9rem;margin:0">A lista base (hambúrguer, pizza, gelado, etc.) mantém-se. Aqui acrescentam ou isentam palavras, separadas por vírgulas.</p>
  <label>Também é “Gordos!”<textarea id="radd" placeholder="ex.: cerveja, pão de alho"></textarea></label>
  <label>Nunca é “Gordos!” (isenta)<textarea id="rskip" placeholder="ex.: chocolate negro"></textarea></label>
  <div class="row" style="margin:0"><button class="pri" id="rsave">Guardar</button><button id="rcancel">Cancelar</button></div>
</dialog>

<script>

[/bolacha/i,450,200],[/p[aã]o/i,265,60],[/croissant/i,406,60],[/bolo/i,350,100],[/torrada/i,400,100],
[/frango|peru/i,165,500],[/bife|vaca|carne/i,200,300],[/porco/i,240,400],[/salm[aã]o/i,208,300],[/bacalhau/i,110,400],[/atum/i,130,120],[/camar[aã]o/i,99,250],[/peixe/i,120,300],[/fiambre|presunto/i,150,200],[/chouri[cç]o|salsicha/i,300,200],[/hamb[uú]rguer/i,250,200],
[/leite/i,46,1000],[/iogurte/i,65,125],[/queijo/i,350,200],[/manteiga de amendoim/i,590,350],[/manteiga/i,717,250],[/natas?/i,200,200],[/ovos?/i,143,60],

var JUNK=/hamb[uú]rguer|burger|pizza|nuggets|batatas? fritas?|chips|refrigerante|coca[- ]?cola|\bcoca\b|fanta|sprite|pepsi|gelado|chocolate|bolacha|\bbolos?\b|croissant|donut|\bdoces?\b|\bgomas?\b|rebu[cç]ados|nutella|kebab|mcdonald|hot ?dog|fritos?|salgad|maionese|ketchup/i;
var RANK=[[3000,"Gordinhos"],[6000,"Gordos"],[9000,"Muito Gordos"],[12000,"Gordalhufos"],[Infinity,"Gordalhões"]];
function rank(k){for(var i=0;i<RANK.length;i++)if(k<RANK[i][0])return RANK[i][1]}
function words(t){return String(t||"").toLowerCase().split(/[,;\n]/).map(function(w){return w.trim()}).filter(Boolean)}
function isGordo(it){
  if(it.cat==="Limpeza"||it.cat==="Higiene")return false;
  if(it.gordo===true)return true;
  if(it.gordo===false)return false;
  var n=it.name.toLowerCase();
  if(words(S.rules.skip).some(function(w){return n.indexOf(w)>-1}))return false;
  if(words(S.rules.add).some(function(w){return n.indexOf(w)>-1}))return true;
  return JUNK.test(it.name);
}

}
$("tund").onclick=function(){if(undoFn)undoFn();$("toast").style.display="none"};

$("c").innerHTML=CATS.map(function(c){return '<option value="'+c+'">'+EMO[c]+' '+c+'</option>'}).join("");
var catTouched=false;
$("ec").innerHTML=$("c").innerHTML;
var editId=null;
$("c").onchange=function(){catTouched=true};
$("n").oninput=function(){
  if(catTouched)return;
  var k=S.known[$("n").value.trim().toLowerCase()];
  $("c").value=k?k.cat:guess($("n").value);
};

function add(name,qty,cat){
  name=name.trim();if(!name)return;
  var ex=find(name);
  if(ex){ex.done=false;save();render();toast("Já estava na lista");return}
  cat=cat||guess(name);
  S.items.push({id:uid(),name:name,qty:(qty||"").trim(),cat:cat,done:false,price:0});
  var k=name.toLowerCase();
  S.known[k]={name:name,cat:cat,n:((S.known[k]||{}).n||0)+1};
  save();render();
}
$("f").onsubmit=function(e){
  e.preventDefault();
  add($("n").value,$("q").value,$("c").value);
  $("n").value="";$("q").value="";catTouched=false;$("n").focus();
};

$("reset").onclick=function(){
  var snap=S.items.map(function(i){return i.done});
  var cnt=snap.filter(Boolean).length;
  if(!cnt){toast("Não há itens riscados");return}
  S.items.forEach(function(i){i.done=false});
  save();render();
  toast(cnt+" itens repostos",function(){S.items.forEach(function(i,x){i.done=snap[x]});save();render()});
};
$("hide").onclick=function(){S.hide=!S.hide;save();render()};

function removeDone(){
  var prev=S.items.slice();
  var n=S.items.filter(function(i){return i.done}).length;
  if(!n){toast("Não há itens riscados");return}
  S.items=S.items.filter(function(i){return !i.done});
  save();render();
  toast(n+" removidos",function(){S.items=prev;save();render()});
}

$("list").onclick=function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var id=t.dataset.id,it=S.items.filter(function(i){return i.id===id})[0];if(!it)return;
  if(t.dataset.act==="del"){
    var prev=S.items.slice();
    S.items=S.items.filter(function(i){return i.id!==id});
    save();render();
    toast("“"+it.name+"” removido",function(){S.items=prev;save();render()});
  }else if(t.dataset.act==="edit"){
    editId=id;
    $("en").value=it.name;$("eq").value=it.qty||"";
    $("ec").value=it.cat;$("ep").value=it.price||"";
    $("eg").value=it.gordo===true?"1":it.gordo===false?"0":"";
    $("edlg").showModal();
  }
};
$("list").onchange=function(e){
  var t=e.target;if(t.type!=="checkbox")return;
  var it=S.items.filter(function(i){return i.id===t.dataset.id})[0];
  if(it){it.done=t.checked;save();render()}
};

function kcalOf(it){
  if(!CATDEF[it.cat])return 0;
  var kc=CATDEF[it.cat][0],ug=CATDEF[it.cat][1];
  for(var i=0;i<CAL.length;i++)if(CAL[i][0].test(it.name)){kc=CAL[i][1];ug=CAL[i][2];break}
  var q=(it.qty||"").toLowerCase().replace(",","."),m=q.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l|d[uú]zia|dz)?/),g;
  if(m){var n=parseFloat(m[1]),u=m[2];
    g=(u==="kg"||u==="l")?n*1000:(u==="g"||u==="ml")?n:u==="cl"?n*10:(u&&u.charAt(0)==="d")?n*12*ug:n*ug;
  }else g=ug;
  return g*kc/100;
}
function donut(vals,unit,center){
  var tot=vals.reduce(function(a,b){return a+b},0);
  if(!tot)return '<div class="empty">Sem dados</div>';
  var off=0,seg="",leg="";
  CATS.forEach(function(c,i){
    var v=vals[i];if(!v)return;var p=v/tot*100;
    seg+='<circle r="15.9155" cx="21" cy="21" fill="none" stroke="'+COL[i]+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+(25-off)+'"/>';
    off+=p;
    leg+='<li><i style="background:'+COL[i]+'"></i>'+EMO[c]+' '+esc(c)+'<b>'+Math.round(p)+'%'+(unit?' · '+Math.round(v)+' '+unit:'')+'</b></li>';
  });
  return '<svg viewBox="0 0 42 42" role="img" aria-label="Gráfico circular"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="#222" stroke-width="6"/>'+seg+'<text x="21" y="21.5" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="4.2" font-weight="700">'+center+'</text></svg><ul class="leg">'+leg+'</ul>';
}
function charts(){
  if(!S.items.length){$("charts").innerHTML="";return}
  var cnt=CATS.map(function(c){return S.items.filter(function(i){return i.cat===c}).length});
  var kc=CATS.map(function(c){return S.items.filter(function(i){return i.cat===c}).reduce(function(a,i){return a+kcalOf(i)},0)});
  var tk=Math.round(kc.reduce(function(a,b){return a+b},0));
  $("charts").innerHTML='<h2><b>📊 Resumo</b></h2><div class="ch"><div class="card"><p>Por categoria (nº de itens)</p>'+donut(cnt,"",S.items.length+" itens")+'</div><div class="card"><p>Calorias estimadas</p>'+donut(kc,"kcal",tk+" kcal")+(tk?'<p class="rank">Classificação: <b>'+rank(tk)+'</b></p>':"")+'<small>Valores médios aproximados. Para carne, peixe e outros ao peso, escreve o peso na quantidade (ex.: 500g, 1kg). Sem peso, conta 1 embalagem média (ex.: carne 300 g, frango 500 g). Limpeza e higiene não contam.</small></div></div>';
}
function sty(ci){
  var n=parseInt(COL[ci].slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  function x(a){return "rgba("+r+","+g+","+b+","+a+")"}
  return "--card:"+x(.2)+";--bd:"+x(.42)+";--ln:"+x(.18)+";--chip:"+x(.3);
}
function render(){
  var tot=S.items.length,done=S.items.filter(function(i){return i.done}).length;
  $("sub").textContent=(tot?(done+" de "+tot+" no carrinho"):"Lista vazia")+(DB?" · ☁️ sincronizada":"");
  $("bar").style.width=(tot?done/tot*100:0)+"%";
  $("hide").textContent=S.hide?"Mostrar riscados":"Esconder riscados";
  var html="";
  CATS.forEach(function(c,ci){
    var its=S.items.filter(function(i){return i.cat===c&&!(S.hide&&i.done)});
    if(!its.length)return;
    its.sort(function(a,b){return a.done-b.done});
    var left=its.filter(function(i){return !i.done}).length;
    html+='<section style="'+sty(ci)+'"><h2><b><em>'+EMO[c]+"</em>"+esc(c)+"</b><span>"+left+"/"+its.length+"</span></h2><ul>"+its.map(function(i){
      return '<li class="'+(i.done?"done":"")+'"><input type="checkbox" id="k'+i.id+'" data-id="'+i.id+'"'+(i.done?" checked":"")+'><label for="k'+i.id+'">'+esc(i.name)+
        (i.qty?'<span class="q">'+esc(i.qty)+'</span>':"")+(isGordo(i)?'<span class="gordo">Gordos!</span>':"")+(i.price?'<span class="p">'+i.price.toFixed(2)+' €</span>':"")+
        '</label><button data-act="edit" data-id="'+i.id+'" aria-label="Editar '+esc(i.name)+'">✎</button><button data-act="del" data-id="'+i.id+'" aria-label="Remover '+esc(i.name)+'">✕</button></li>';
    }).join("")+"</ul></section>";
  });
  $("list").innerHTML=html||'<div class="empty"><div class="big">🛒</div>Lista vazia.<br>Adiciona um produto ou toca num habitual.</div>';
  var sum=S.items.reduce(function(a,i){return a+(i.price||0)},0);
  charts();
  $("total").textContent=sum?("Total estimado: "+sum.toFixed(2)+" €"):"";
  var names=Object.keys(S.known).map(function(k){return S.known[k]});
  $("sug").innerHTML=names.map(function(k){return '<option value="'+esc(k.name)+'">'}).join("");
  var hab=names.filter(function(k){return !find(k.name)}).sort(function(a,b){return b.n-a.n||CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.name.localeCompare(b.name)});var total=hab.length;if(!showAll)hab=hab.slice(0,10);
  $("chips").innerHTML=hab.length?"<b>Habituais (toca para adicionar)</b>"+hab.map(function(k){return '<button class="chip" data-name="'+esc(k.name)+'">+ '+EMO[k.cat||"Outros"]+' '+esc(k.name)+'</button>'}).join("")+(total>10?'<button class="chip" id="allchips">'+(showAll?"Ver menos":"Ver todos ("+total+")")+'</button>':""):"";
}
$("chips").onclick=function(e){
  var b=e.target.closest(".chip");if(!b)return;
  if(b.id==="allchips"){showAll=!showAll;render();return}
  var k=S.known[b.dataset.name.toLowerCase()];
  add(b.dataset.name,"",k&&k.cat);
};

var dlg=$("dlg");
function dopen(t){$("dtitle").textContent=t||"Mais opções";$("ta").hidden=true;$("d-ok").hidden=true;dlg.showModal()}
$("more").onclick=function(){dopen()};
$("d-close").onclick=function(){dlg.close()};
$("d-clear").onclick=function(){dlg.close();removeDone()};
function copy(txt,msg){
  function fb(){var t=$("ta");t.hidden=false;t.value=txt;t.select();try{document.execCommand("copy");toast(msg)}catch(e){toast("Seleciona e copia o texto")}}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){toast(msg)},fb);else fb();
}
$("d-copy").onclick=function(){
  var out=["Lista Compras Pipo & Nonô"];
  CATS.forEach(function(c){
    var its=S.items.filter(function(i){return i.cat===c&&!i.done});
    if(its.length){out.push("","*"+EMO[c]+" "+c+"*");its.forEach(function(i){out.push("• "+(i.qty?i.qty+" ":"")+i.name)})}
  });
  copy(out.join("\n"),"Lista copiada");
};
$("d-backup").onclick=function(){copy(JSON.stringify(S),"Cópia copiada")};
$("d-merge").onclick=function(){mergeMode=true;$("dtitle").textContent="Cola aqui a cópia para juntar à tua lista";var t=$("ta");t.hidden=false;t.value="";t.focus();$("d-ok").hidden=false};
$("d-restore").onclick=function(){mergeMode=false;
  $("dtitle").textContent="Cola aqui a cópia de segurança";
  var t=$("ta");t.hidden=false;t.value="";t.focus();$("d-ok").hidden=false;
};
$("d-ok").onclick=function(){
  try{
    var o=JSON.parse($("ta").value);
    if(!o||!Array.isArray(o.items))throw 0;
    if(mergeMode){
      o.items.forEach(function(it){if(!find(it.name)){it.id=uid();S.items.push(it)}});
      Object.keys(o.known||{}).forEach(function(k){if(!S.known[k])S.known[k]=o.known[k]});
      save();render();dlg.close();toast("Cópia juntada");
    }else{
      S={items:o.items,known:o.known||{},hide:!!o.hide,rules:o.rules||{add:"",skip:""},seeded:o.seeded};
      seed();save();render();dlg.close();toast("Cópia restaurada");
    }
  }catch(e){toast("Cópia inválida")}
};

$("es").onclick=function(){
  var it=S.items.filter(function(i){return i.id===editId})[0];
  if(!it){$("edlg").close();return}
  var nm=$("en").value.trim();
  if(!nm){$("en").focus();return}
  var dup=find(nm);
  if(dup&&dup!==it){toast("Já existe um item com esse nome");return}
  var old=it.name.toLowerCase(),nk=nm.toLowerCase(),n=(S.known[old]||{}).n||1;
  if(old!==nk)delete S.known[old];
  it.name=nm;it.qty=$("eq").value.trim();it.cat=$("ec").value;
  it.price=parseFloat(String($("ep").value).replace(",","."))||0;
  if($("eg").value==="")delete it.gordo;else it.gordo=$("eg").value==="1";
  S.known[nk]={name:nm,cat:it.cat,n:n};
  save();render();$("edlg").close();
};
$("ecancel").onclick=function(){$("edlg").close()};
$("d-rules").onclick=function(){dlg.close();$("radd").value=S.rules.add||"";$("rskip").value=S.rules.skip||"";$("rdlg").showModal()};
$("rsave").onclick=function(){S.rules={add:$("radd").value.trim(),skip:$("rskip").value.trim()};save();render();$("rdlg").close();toast("Regras guardadas")};
$("rcancel").onclick=function(){$("rdlg").close()};
seed();
/* Sincronização automática (só quando a página está publicada com acesso à base de dados) */
try{
  if(window.claude&&window.claude.use){
    window.claude.use("db").then(function(db){
      if(!db)return;
      var ref=db.doc("lista/estado");
      ref.onSnapshot(function(snap){
        if(!DB){DB=ref;render()}
        if(!snap.exists){if(S.items.length||Object.keys(S.known).length)push();return}
        var j=snap.data().state;
        if(j===lastSent||j===JSON.stringify(S))return;
        try{
          var o=JSON.parse(j);
          if(o&&Array.isArray(o.items)){
            S={items:o.items,known:o.known||{},hide:!!o.hide,rules:o.rules||{add:"",skip:""},seeded:o.seeded};
            lastSent=j;seed();try{localStorage.setItem(KEY,j)}catch(e){}
            render();
          }
        }catch(e){}
      },function(){});
    }).catch(function(){});
  }
}catch(e){}
render();
})();
</script>
</body>
</html>
